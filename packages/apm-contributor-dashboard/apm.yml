name: apm-contributor-dashboard
version: 0.1.0
description: >
  Live contributor dashboard canvas for the richard-fowles-epam/apm
  demo fork.
  Tracks issues, PRs, CI pipelines, and panel reviews in a single
  interactive panel with real-time GitHub data, collaborative comment
  drafting with Copilot, and permission-aware action buttons.
  Defaults to richard-fowles-epam/apm; override with APM_DASHBOARD_REPO.
  Refuses microsoft/apm.
author: microsoft
license: Apache-2.0
targets:
  - copilot
